  <g id="text_22">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(50.14375 300.765859)">Archived patient-grouped folds; training-only Z-score and shrinkage LDA. Historical candidate ranking and cohort-level CNV fixed.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(50.14375 310.284)">Dashed lines mark the main rules (0.65 and q95). GSE200997 has two positive cases. Frozen-q95 input sensitivity is reported in Table S3.</text>
  </g>
