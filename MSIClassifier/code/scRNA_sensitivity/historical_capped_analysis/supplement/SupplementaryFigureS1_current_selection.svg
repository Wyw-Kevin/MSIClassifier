   </g>
   <g id="text_13">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(468.108 199.056225)">Target cohort held out in each round</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(468.108 210.581956)">Seven other cohorts fit four cutoffs</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(468.108 222.107687)">Held-out outcomes excluded from fitting</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(468.108 233.633419)">Label-free target gene standardization</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="27.288" y="330.806437" transform="rotate(-0 27.288 330.806437)">Ten-subtype classifier</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(27.288 348.896194)">MLP configuration fixed; seed 2026</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(27.288 360.683873)">Development: five-fold OOF</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(27.288 372.471553)">GEO: full-development-model scoring</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(27.288 384.259233)">Training-only classifier Z-score</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="247.698" y="330.806437" transform="rotate(-0 247.698 330.806437)">Fixed-half fusion</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(247.698 348.896194)">0.50 × subtype + 0.50 × MMR4</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(247.698 360.683873)">Match held-out cohort MMR4 scores</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(247.698 372.471553)">Keep subtype predictions fixed</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(247.698 384.259233)">Equal-weight cohort macro metrics</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: start" x="468.108" y="330.654469" transform="rotate(-0 468.108 330.654469)">Evaluation scope</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(468.108 348.744225)">Eight evaluation-specific cutoff sets</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(468.108 360.269956)">Retrospective historical cohort exposure</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(468.108 371.795687)">Conditional on fixed upstream inputs</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'" transform="translate(468.108 383.321419)">New deployment parameters need fitting</text>
   </g>
